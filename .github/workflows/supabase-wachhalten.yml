# Hält das kostenlose Supabase-Projekt aktiv (wird sonst nach 7 Tagen ohne Nutzung pausiert).
# Läuft nur, wenn die Secrets SUPABASE_URL und SUPABASE_ANON_KEY im Repo hinterlegt sind.
name: Supabase wach halten
on:
  schedule:
    - cron: "17 6 */3 * *"   # alle 3 Tage
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase nicht eingerichtet – nichts zu tun."; exit 0; fi
          curl -fsS "$URL/rest/v1/ping?select=id" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
